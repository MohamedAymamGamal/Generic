name: ecom-dev

# ══════════════════════════════════════════════════════════════════
#  NETWORKS
# ══════════════════════════════════════════════════════════════════
networks:
  ecom-net:
    driver: bridge

# ══════════════════════════════════════════════════════════════════
#  VOLUMES
# ══════════════════════════════════════════════════════════════════
volumes:
  sqlserver-data:
  redis-data:
  nuget-cache:    # reuse restored packages across rebuilds → faster startup

# ══════════════════════════════════════════════════════════════════
#  SERVICES
# ══════════════════════════════════════════════════════════════════
services:

  # ── Ecom.API (hot-reload dev server) ────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecom-api:dev
    container_name: ecom-api
    restart: unless-stopped
    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"

      # ── Connection Strings ──────────────────────────────────────
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Ecom_v;User Id=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;Connect Timeout=30;"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"

      # ── Email ───────────────────────────────────────────────────
      EmailSetting__Port: "465"
      EmailSetting__From: ${EMAIL_FROM}
      EmailSetting__UserName: ${EMAIL_USERNAME}
      EmailSetting__Password: ${EMAIL_PASSWORD}
      EmailSetting__smtp: "smtp.gmail.com"

      # ── JWT ─────────────────────────────────────────────────────
      Token__Secret: ${JWT_SECRET}
      Token__Issuer: "http://localhost:8080"

    volumes:
      # ── Full solution mounted → dotnet watch sees every change ──
      - .:/src                               
      # ── NuGet cache persisted → restore only on new packages ───
      - nuget-cache:/root/.nuget/packages    
      # ── Logs ────────────────────────────────────────────────────
      - ./logs:/src/Ecom.API/logs

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-net

  # ── SQL Server 2022 ─────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecom-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"       
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./docker/sqlserver/init:/docker-entrypoint-initdb.d:ro   # optional seed .sql files
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -No -C"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecom-net

  # ── Redis 7 (Alpine) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"       # connect from RedisInsight on host
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ── RedisInsight GUI (optional) ─────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: ecom-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"       # http://localhost:5540
    depends_on:
      - redis
    networks:
      - ecom-net
    profiles:
      - tools             # docker compose --profile tools up